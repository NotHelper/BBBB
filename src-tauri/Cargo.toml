[package]
name = "brail-performance-monitor"
version = "0.1.0"
description = "Brail Performance Monitor native engine"
authors = ["Brail"]
edition = "2021"
license = "MIT"
rust-version = "1.98"

[lib]
name = "brail_performance_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.7.0"

[dependencies]
tauri = { version = "2.12.0", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
chrono = { version = "0.4", features = ["clock", "serde"] }
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
